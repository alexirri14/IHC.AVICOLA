<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ERP Avícola</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">🥚</span>
    <div>
      <h1>ERP Avícola</h1>
      <small id="empresaNombre">El Rancho del Buen Pastor</small>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="nav-item active" data-section="dashboard"><span class="icon">🏠</span> Dashboard</div>
    <div class="nav-item" data-section="galpones"><span class="icon">🐔</span> Galpones</div>
    <div class="nav-item" data-section="molino"><span class="icon">🌾</span> Molino</div>
    <div class="nav-item" data-section="inventario"><span class="icon">📦</span> Inventario <span class="arrow">▶</span></div>
    <div class="nav-sub" id="subInventario">
      <div class="nav-item" data-section="almacen-huevos"><span class="icon">🥚</span> Almacén de Huevos</div>
      <div class="nav-item" data-section="almacen-insumos"><span class="icon">📦</span> Almacén de Insumos</div>
    </div>
    <div class="nav-item" data-section="compras"><span class="icon">🛒</span> Compras</div>
    <div class="nav-item" data-section="ventas"><span class="icon">💰</span> Ventas</div>
    <div class="nav-item" data-section="reportes"><span class="icon">📊</span> Reportes</div>
    <div class="nav-item" data-section="configuracion"><span class="icon">⚙</span> Configuración</div>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter">
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">A</div>
      <div>
        <div class="user-name" id="userName">Admin</div>
        <div class="user-rol" id="userRol">Administrador</div>
      </div>
    </div>
    <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburger">☰</button>
    <h2 id="sectionTitle">Dashboard</h2>
    <div class="topbar-info">
      <span class="role-badge" id="roleBadge">Administrador</span>
    </div>
  </div>
  <div class="content" id="content">
  </div>
</div>

<div id="modalContainer"></div>

<script src="app.js"></script>
</body>
</html>
